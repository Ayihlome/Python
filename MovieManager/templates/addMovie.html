{% extends 'base.html' %} {% block title %}Sales{%endblock%} {%block content%}
<!-- Main Content -->
<main class="container mx-auto px-6 py-8">
  <div class="max-w-2xl mx-auto">
    <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">
      Create New Movie Entry
    </h2>

    <!-- New Movie Form -->
    <form
      action="{{ url_for('addMovie') }}"
      method="POST"
      class="bg-white rounded-lg shadow-md p-8"
    >
      <fieldset class="space-y-6">
        <legend
          class="text-xl font-semibold text-gray-700 mb-6 border-b border-gray-200 pb-2"
        >
          Movie Information
        </legend>

        <div>
          <label
            for="title"
            class="block text-sm font-medium text-gray-700 mb-2"
            >Movie Title:</label
          >
          <input
            type="text"
            name="title"
            id="title"
            required
            placeholder="Enter movie title"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent"
          />
        </div>

        <div>
          <label
            for="release_date"
            class="block text-sm font-medium text-gray-700 mb-2"
            >Release Date:</label
          >
          <input
            type="date"
            name="release_date"
            id="release_date"
            required
            placeholder="YYYY-MM-DD"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent"
          />
        </div>

        <div>
          <label
            for="end_date"
            class="block text-sm font-medium text-gray-700 mb-2"
            >End Date:</label
          >
          <input
            type="date"
            name="end_date"
            id="end_date"
            required
            placeholder="YYYY-MM-DD"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent"
          />
        </div>

        <div>
          <label
            for="cinema_room"
            class="block text-sm font-medium text-gray-700 mb-2"
            >Cinema Room:</label
          >
          <select
            name="cinema_room"
            id="cinema_room"
            required
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent"
          >
            <option value="">Select a cinema room...</option>
            <option value="1">Room 1</option>
            <option value="2">Room 2</option>
            <option value="3">Room 3</option>
            <option value="4">Room 4</option>
            <option value="5">Room 5</option>
            <option value="6">Room 6</option>
            <option value="7">Room 7</option>
          </select>
        </div>

        <div>
          <label
            for="tickets_available"
            class="block text-sm font-medium text-gray-700 mb-2"
            >Tickets Available:</label
          >
          <input
            type="number"
            name="tickets_available"
            id="tickets_available"
            min="1"
            max="800"
            value="150"
            required
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent"
          />
        </div>

        <div>
          <label
            for="ticket_price"
            class="block text-sm font-medium text-gray-700 mb-2"
            >Ticket Price (R):</label
          >
          <input
            type="number"
            name="ticket_price"
            id="ticket_price"
            min="0"
            step="10.00"
            value="120"
            required
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent"
          />
        </div>

        <div class="flex space-x-4 pt-4">
          <button
            type="submit"
            class="flex-1 bg-gradient-to-r from-green-600 to-teal-600 text-white font-medium py-3 px-6 rounded-md hover:from-green-700 hover:to-teal-700 transition-all duration-200 shadow-md hover:shadow-lg"
          >
            Add Movie
          </button>
          <button
            type="reset"
            class="flex-1 bg-gray-500 text-white font-medium py-3 px-6 rounded-md hover:bg-gray-600 transition-all duration-200 shadow-md hover:shadow-lg"
          >
            Clear Form
          </button>
        </div>
      </fieldset>
    </form>
  </div>
</main>
{%endblock%}
