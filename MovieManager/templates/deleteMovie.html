{% extends 'base.html' %}
{% block title %}Delete A Movie{%endblock%}
<header nclass="bg-gradient-to-r from-orange-600 to-amber-600 text-white shadow-lg">
{%block content%}
    <!-- Main Content -->
    <main class="container mx-auto px-6 py-8">
      <div class="max-w-2xl mx-auto">
        <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">
          Delete Movie
        </h2>

        <!-- Movie Selection -->
        <div class="bg-white rounded-lg shadow-md p-8">
          <form
            action="{{ url_for('deleteMovie')}}"
            method="POST"
            onsubmit="return confirmDelete();"
          >
            <h3 class="text-lg font-semibold text-gray-700 mb-4">
              Select Movie to Delete
            </h3>
            <div class="mb-6">
              <label
                for="movie_select"
                class="block text-sm font-medium text-gray-700 mb-2"
                >Choose Movie:</label
              >
              <select
                name="movie_select"
                id="movie_select"
                required
                onchange="showMovieDetails()"
              >
                <option value="">Select a movie to delete...</option>
                {% for movie in movies %}
                <option value="{{ movie.movie_id }}">{{ movie.title }}</option>
                {% endfor %}
              </select>
            </div>

            <!-- Movie Details Display -->
            <div
              id="movieDetails"
              class="hidden bg-orange-50 border border-orange-200 rounded-lg p-4 mb-6"
            >
              <h4 class="text-lg font-semibold text-orange-800 mb-3">
                Movie Details
              </h4>
              <div class="grid grid-cols-2 gap-4 mb-4">
                <div>
                  <label class="block text-sm font-medium text-orange-700 mb-1"
                    >Title:</label
                  >
                  <span
                    id="movieTitle"
                    class="text-lg font-bold text-orange-800"
                    >-</span
                  >
                </div>
                <div>
                  <label class="block text-sm font-medium text-orange-700 mb-1"
                    >Release Date:</label
                  >
                  <span
                    id="movieReleaseDate"
                    class="text-lg font-bold text-orange-800"
                    >-</span
                  >
                </div>
                <div>
                  <label class="block text-sm font-medium text-orange-700 mb-1"
                    >End Date:</label
                  >
                  <span
                    id="movieEndDate"
                    class="text-lg font-bold text-orange-800"
                    >-</span
                  >
                </div>
                <div>
                  <label class="block text-sm font-medium text-orange-700 mb-1"
                    >Cinema Room:</label
                  >
                  <span id="movieRoom" class="text-lg font-bold text-orange-800"
                    >-</span
                  >
                </div>
                <div>
                  <label class="block text-sm font-medium text-orange-700 mb-1"
                    >Tickets Available:</label
                  >
                  <span
                    id="movieTickets"
                    class="text-lg font-bold text-orange-800"
                    >-</span
                  >
                </div>
                <div>
                  <label class="block text-sm font-medium text-orange-700 mb-1"
                    >Ticket Price:</label
                  >
                  <span
                    id="moviePrice"
                    class="text-lg font-bold text-orange-800"
                    >-</span
                  >
                </div>
              </div>
            </div>

            <!-- Delete Button -->
            <div class="flex space-x-4">
              <button
                type="submit"
                id="deleteBtn"
                disabled
                class="flex-1 bg-gradient-to-r from-orange-600 to-amber-600 text-white font-medium py-3 px-6 rounded-md hover:from-orange-700 hover:to-amber-700 transition-all duration-200 shadow-md hover:shadow-lg disabled:opacity-50 disabled:cursor-not-allowed"
              >
                Delete Movie
              </button>
              <button
                type="button"
                onclick="clearSelection()"
                class="flex-1 bg-gray-500 text-white font-medium py-3 px-6 rounded-md hover:bg-gray-600 transition-all duration-200 shadow-md hover:shadow-lg"
              >
                Clear Selection
              </button>
            </div>
          </form>
        </div>
      </div>
    </main>
{%endblock%}
    <!-- Footer -->
    <footer class="bg-gray-800 text-white py-6 mt-12">
      <div class="container mx-auto px-6 text-center">
        <p>&copy; 2024 Movie Ticket Booking System. All rights reserved.</p>
      </div>
    </footer>

    <!-- JavaScript for loading movie details -->
    <script>
      {%block script%}
      const movieData = {
        {% for movie in movies %}
        "{{ movie.movie_id }}": {
          title: "{{ movie.title }}",
          release_date: "{{ movie.release_date }}",
          end_date: "{{ movie.end_date }}",
          cinema_room: "{{ movie.cinema_room }}",
          tickets_available: {{ movie.tickets_available }},
          ticket_price: {{ movie.ticket_price }}
        },
        {% endfor %}
      };

      function showMovieDetails() {
        const movieSelect = document.getElementById("movie_select");
        const movieDetails = document.getElementById("movieDetails");
        const deleteBtn = document.getElementById("deleteBtn");
        const selectedMovie = movieSelect.value;

        if (selectedMovie && movieData[selectedMovie]) {
          const movie = movieData[selectedMovie];

          // Populate movie details
          document.getElementById("movieTitle").textContent = movie.title;
          document.getElementById("movieReleaseDate").textContent =
            movie.release_date;
          document.getElementById("movieEndDate").textContent = movie.end_date;
          document.getElementById("movieRoom").textContent = movie.cinema_room;
          document.getElementById("movieTickets").textContent =
            movie.tickets_available;
          document.getElementById(
            "moviePrice"
          ).textContent = `$${movie.ticket_price}`;

          // Show details and enable delete button
          movieDetails.classList.remove("hidden");
          deleteBtn.disabled = false;
        } else {
          // Hide details and disable delete button
          movieDetails.classList.add("hidden");
          deleteBtn.disabled = true;
        }
      }

      function deleteMovie() {
        const movieSelect = document.getElementById("movie_select");
        const selectedMovie = movieSelect.value;

        if (selectedMovie && movieData[selectedMovie]) {
          const movie = movieData[selectedMovie];
          const confirmed = confirm(
            `Are you sure you want to delete "${movie.title}"? This action cannot be undone.`
          );

          if (confirmed) {
            alert(
              `"${movie.title}" has been successfully deleted from the system.`
            );
            clearSelection();
          }
        }
      }

      function clearSelection() {
        document.getElementById("movie_select").value = "";
        document.getElementById("movieDetails").classList.add("hidden");
        document.getElementById("deleteBtn").disabled = true;
      }

      function confirmDelete() {
        const movieSelect = document.getElementById("movie_select");
        const selectedMovie = movieSelect.value;
        if (!selectedMovie) return false;
        const movie = movieData[selectedMovie];
        return confirm(`Are you sure you want to delete "${movie.title}"? This action cannot be undone.`);
      }
      {%endblock%}
    </script>
  </body>
</html>
