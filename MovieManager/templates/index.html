<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movie Ticket Booking System</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100 min-h-screen">
    <!-- Header -->
    <header
      class="bg-gradient-to-r from-purple-600 to-blue-600 text-white shadow-lg"
    >
      <div class="container mx-auto px-6 py-4">
        <h1 class="text-3xl font-bold mb-2">Movie Ticket Booking System</h1>
        <p class="text-purple-100 mb-6">Book your favorite movies online</p>

        <!-- Navigation Menu -->
        <nav class="border-t border-purple-400 pt-4">
          <ul class="flex space-x-8">
            <li>
              <a
                href="{{ url_for('homePage') }}"
                class="hover:text-purple-200 font-medium transition-colors"
                >Home</a
              >
            </li>
            <li>
              <a
                href="{{ url_for('addMovie') }}"
                class="hover:text-purple-200 font-medium transition-colors"
                >Add Movie</a
              >
            </li>
            <li>
              <a
                href="{{ url_for('updateMovie') }}"
                class="hover:text-purple-200 font-medium transition-colors"
                >Update Movie</a
              >
            </li>
            <li>
              <a
                href="{{ url_for('deleteMovie') }}"
                class="hover:text-purple-200 font-medium transition-colors"
                >Delete Movie</a
              >
            </li>
          </ul>
        </nav>
      </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-6 py-8">
      <div class="max-w-2xl mx-auto">
        <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">
          Purchase Movie Tickets
        </h2>

        <!-- Movie Ticket Purchase Form -->
        <form
          action="{{ url_for('homePage') }}"
          method="post"
          class="bg-white rounded-lg shadow-md p-8"
        >
          <fieldset class="space-y-6">
            <legend
              class="text-xl font-semibold text-gray-700 mb-6 border-b border-gray-200 pb-2"
            >
              Ticket Information
            </legend>

            <div>
              <label
                for="movie"
                class="block text-sm font-medium text-gray-700 mb-2"
                >Select Movie:</label
              >
              <select
                name="movie"
                id="movie"
                required
                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                onchange="showMovieDetails()"
              >
                <option value="">Choose a movie...</option>
                {% for movie in movies %}
                <option value="{{ movie.movie_id }}">
                  {{ movie.title }} - Room {{ movie.cinema_room }}
                </option>
                {% endfor %}
              </select>
            </div>

            <div>
              <label
                for="customer_name"
                class="block text-sm font-medium text-gray-700 mb-2"
                >Customer Name:</label
              >
              <input
                type="text"
                name="customer_name"
                id="customer_name"
                required
                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent"
              />
            </div>

            <div>
              <label
                for="tickets"
                class="block text-sm font-medium text-gray-700 mb-2"
                >Number of Tickets:</label
              >
              <input
                type="number"
                name="tickets"
                id="tickets"
                min="1"
                max="10"
                value="1"
                required
                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                onchange="calculateTotal()"
                oninput="calculateTotal()"
              />
            </div>

            <div>
              <label
                for="cinema_room"
                class="block text-sm font-medium text-gray-700 mb-2"
                >Cinema Room:</label
              >
              <select
                name="cinema_room"
                id="cinema_room"
                required
                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent"
              >
                <option value="">Select room...</option>
                <option value="1">Room 1</option>
                <option value="2">Room 2</option>
                <option value="3">Room 3</option>
                <option value="4">Room 4</option>
              </select>
            </div>

            <!-- Movie Details Display -->
            <div
              id="movieDetails"
              class="hidden bg-purple-50 border border-purple-200 rounded-lg p-4 mb-6"
            >
              <div class="grid grid-cols-2 gap-4 mb-4">
                <div>
                  <label class="block text-sm font-medium text-purple-700 mb-1"
                    >Price per Ticket:</label
                  >
                  <span
                    id="moviePrice"
                    class="text-lg font-bold text-purple-800"
                    >$0.00</span
                  >
                </div>
                <div>
                  <label class="block text-sm font-medium text-purple-700 mb-1"
                    >Cinema Room:</label
                  >
                  <span id="movieRoom" class="text-lg font-bold text-purple-800"
                    >-</span
                  >
                </div>
              </div>

              <!-- Total Price Display -->
              <div
                id="totalPriceSection"
                class="hidden border-t border-purple-200 pt-4"
              >
                <div class="flex justify-between items-center">
                  <div>
                    <span class="text-sm font-medium text-purple-700"
                      >Number of Tickets:</span
                    >
                    <span
                      id="ticketCount"
                      class="ml-2 font-bold text-purple-800"
                      >1</span
                    >
                  </div>
                  <div class="text-right">
                    <span class="text-sm font-medium text-purple-700"
                      >Total Price:</span
                    >
                    <span
                      id="totalPrice"
                      class="ml-2 text-xl font-bold text-green-600"
                      >$0.00</span
                    >
                  </div>
                </div>
              </div>
            </div>

            <div class="flex space-x-4 pt-4">
              <button
                type="submit"
                class="flex-1 bg-gradient-to-r from-purple-600 to-blue-600 text-white font-medium py-3 px-6 rounded-md hover:from-purple-700 hover:to-blue-700 transition-all duration-200 shadow-md hover:shadow-lg"
              >
                Purchase Tickets
              </button>
              <button
                type="reset"
                class="flex-1 bg-gray-500 text-white font-medium py-3 px-6 rounded-md hover:bg-gray-600 transition-all duration-200 shadow-md hover:shadow-lg"
              >
                Clear Form
              </button>
            </div>
          </fieldset>
        </form>
      </div>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-800 text-white py-6 mt-12">
      <div class="container mx-auto px-6 text-center">
        <p>&copy; 2024 Movie Ticket Booking System. All rights reserved.</p>
      </div>
    </footer>

    <!-- JavaScript for Movie Details -->
    <script>
      // Movie data with prices and rooms - this would come from your database
      const movieData = {
        {% for movie in movies %}
        '{{ movie.movie_id }}': {
          name: '{{ movie.title }}',
          price: {{ movie.ticket_price }},
          room: {{ movie.cinema_room }}
        },
        {% endfor %}
      };

      function showMovieDetails() {
        const movieSelect = document.getElementById('movie');
        const movieDetails = document.getElementById('movieDetails');
        const moviePrice = document.getElementById('moviePrice');
        const movieRoom = document.getElementById('movieRoom');
        const totalPriceSection = document.getElementById('totalPriceSection');

        const selectedMovie = movieSelect.value;

        if (selectedMovie && movieData[selectedMovie]) {
          const movie = movieData[selectedMovie];
          moviePrice.textContent = `$${movie.price.toFixed(2)}`;
          movieRoom.textContent = `Room ${movie.room}`;
          movieDetails.classList.remove('hidden');
          totalPriceSection.classList.remove('hidden');
          calculateTotal(); // Calculate total when movie is selected
        } else {
          movieDetails.classList.add('hidden');
          totalPriceSection.classList.add('hidden');
        }
      }

      function calculateTotal() {
        const movieSelect = document.getElementById('movie');
        const ticketsInput = document.getElementById('tickets');
        const ticketCount = document.getElementById('ticketCount');
        const totalPrice = document.getElementById('totalPrice');

        const selectedMovie = movieSelect.value;
        const numberOfTickets = parseInt(ticketsInput.value) || 0;

        if (selectedMovie && movieData[selectedMovie] && numberOfTickets > 0) {
          const movie = movieData[selectedMovie];
          const total = movie.price * numberOfTickets;

          ticketCount.textContent = numberOfTickets;
          totalPrice.textContent = `$${total.toFixed(2)}`;
        } else {
          ticketCount.textContent = '0';
          totalPrice.textContent = '$0.00';
        }
      }
    </script>
  </body>
</html>
