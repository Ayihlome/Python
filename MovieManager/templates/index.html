{% extends 'base.html' %}
{% block title %}Sales{%endblock%}
{%block content%}
<!-- Main Content -->
<main class="container mx-auto px-6 py-8">
  <div class="max-w-2xl mx-auto">
    <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">
      Purchase Movie Tickets
    </h2>

    <!-- Movie Ticket Purchase Form -->
    <form
      action="{{ url_for('homePage') }}"
      method="POST"
      class="bg-white rounded-lg shadow-md p-8"
    >
      <fieldset class="space-y-6">
        <legend
          class="text-xl font-semibold text-gray-700 mb-6 border-b border-gray-200 pb-2"
        >
          Ticket Information
        </legend>

        <div>
          <label
            for="movie"
            class="block text-sm font-medium text-gray-700 mb-2"
            >Select Movie:</label
          >
          <select
            name="movie"
            id="movie"
            required
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent"
            onchange="showMovieDetails()"
          >
            <option value="">Choose a movie...</option>
            {% for movie in movies %}
            <option
              value="{{ movie.movie_id }}"
              data-price="{{ movie.ticket_price }}"
              data-release="{{ movie.release_date }}"
              data-room="{{ movie.cinema_room }}"
            >
              {{ movie.title }}
            </option>
            {% endfor %}
          </select>
        </div>

        <div>
          <label
            for="customer_name"
            class="block text-sm font-medium text-gray-700 mb-2"
            >Customer Name:</label
          >
          <input
            type="text"
            name="customer_name"
            id="customer_name"
            required
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent"
          />
        </div>

        <div>
          <label
            for="tickets"
            class="block text-sm font-medium text-gray-700 mb-2"
            >Number of Tickets:</label
          >
          <input
            type="number"
            name="tickets"
            id="tickets"
            min="1"
            max="10"
            value="1"
            required
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent"
            onchange="showMovieDetails()"
            oninput="showMovieDetails()"
          />
        </div>

        <!-- Movie Details Display -->
        <div
          id="movieDetails"
          class="hidden bg-purple-50 border border-purple-200 rounded-lg p-4 mb-6"
        >
          <div class="grid grid-cols-2 gap-4 mb-4">
            <div>
              <label class="block text-sm font-medium text-purple-700 mb-1"
                >Price per Ticket:</label
              >
              <span
                id="moviePrice"
                class="text-lg font-bold text-purple-800"
                >R0.00</span
              >
            </div>
            <div>
              <label class="block text-sm font-medium text-purple-700 mb-1"
                >Cinema Room:</label
              >
              <span id="movieRoom" class="text-lg font-bold text-purple-800"
                >-</span
              >
            </div>
          </div>

          <!-- Total Price Display -->
          <div
            id="totalPriceSection"
            class="hidden border-t border-purple-200 pt-4"
          >
            <div class="flex justify-between items-center">
              <div>
                <span class="text-sm font-medium text-purple-700"
                  >Number of Tickets:</span
                >
                <span
                  id="ticketCount"
                  class="ml-2 font-bold text-purple-800"
                  >1</span
                >
              </div>
              <div class="text-right">
                <span class="text-sm font-medium text-purple-700"
                  >Total Price:</span
                >
                <span
                  id="totalPrice"
                  class="ml-2 text-xl font-bold text-green-600"
                  >R0.00</span
                >
              </div>
            </div>
          </div>
        </div>

        <!-- Movie Summary Display -->
        <div
          id="movieSummary"
          class="hidden bg-purple-50 border border-purple-200 rounded-lg p-4 mb-6"
        >
          <div class="grid grid-cols-2 gap-4 mb-4">
            <div>
              <label class="block text-sm font-medium text-purple-700 mb-1"
                >Ticket Price:</label
              >
              <span
                id="summaryPrice"
                class="text-lg font-bold text-purple-800"
                >-</span
              >
            </div>
            <div>
              <label class="block text-sm font-medium text-purple-700 mb-1"
                >Release Date:</label
              >
              <span
                id="summaryRelease"
                class="text-lg font-bold text-purple-800"
                >-</span
              >
            </div>
            <div>
              <label class="block text-sm font-medium text-purple-700 mb-1"
                >Cinema Room:</label
              >
              <span
                id="summaryRoom"
                class="text-lg font-bold text-purple-800"
                >-</span
              >
            </div>
            <div>
              <label class="block text-sm font-medium text-purple-700 mb-1"
                >Total Cost:</label
              >
              <span
                id="summaryTotal"
                class="text-lg font-bold text-green-600"
                >-</span
              >
            </div>
          </div>
        </div>

        <div class="flex space-x-4 pt-4">
          <button
            type="submit"
            class="flex-1 bg-gradient-to-r from-purple-600 to-blue-600 text-white font-medium py-3 px-6 rounded-md hover:from-purple-700 hover:to-blue-700 transition-all duration-200 shadow-md hover:shadow-lg"
          >
            Purchase Tickets
          </button>
          <button
            type="reset"
            class="flex-1 bg-gray-500 text-white font-medium py-3 px-6 rounded-md hover:bg-gray-600 transition-all duration-200 shadow-md hover:shadow-lg"
          >
            Clear Form
          </button>
        </div>
      </fieldset>
    </form>
  </div>
</main>
{%endblock%}

    <!-- JavaScript for Movie Details -->
    <script>
      {%block script%}
        // Movie data with prices and rooms - this would come from your database
      const movieData = {
        {% for movie in movies %}
        '{{ movie.movie_id }}': {
          price: {{ movie.ticket_price }},
          release: '{{ movie.release_date }}',
          room: '{{ movie.cinema_room }}'
        },
        {% endfor %}
      };

      function showMovieDetails() {
        const movieSelect = document.getElementById('movie');
        const ticketsInput = document.getElementById('tickets');
        const summary = document.getElementById('movieSummary');
        const summaryPrice = document.getElementById('summaryPrice');
        const summaryRelease = document.getElementById('summaryRelease');
        const summaryRoom = document.getElementById('summaryRoom');
        const summaryTotal = document.getElementById('summaryTotal');

        const selectedMovie = movieSelect.value;
        const numberOfTickets = parseInt(ticketsInput.value) || 0;

        if (selectedMovie && movieData[selectedMovie]) {
          const movie = movieData[selectedMovie];
          summaryPrice.textContent = `R${movie.price.toFixed(2)}`;
          summaryRelease.textContent = movie.release;
          summaryRoom.textContent = `Room ${movie.room}`;
          const total = movie.price * numberOfTickets;
          summaryTotal.textContent = `R${total.toFixed(2)}`;
          summary.classList.remove('hidden');
        } else {
          summary.classList.add('hidden');
        }
      }

      function calculateTotal() {
        const movieSelect = document.getElementById('movie');
        const ticketsInput = document.getElementById('tickets');
        const ticketCount = document.getElementById('ticketCount');
        const totalPrice = document.getElementById('totalPrice');

        const selectedMovie = movieSelect.value;
        const numberOfTickets = parseInt(ticketsInput.value) || 0;

        if (selectedMovie && movieData[selectedMovie] && numberOfTickets > 0) {
          const movie = movieData[selectedMovie];
          const total = movie.price * numberOfTickets;

          ticketCount.textContent = numberOfTickets;
          totalPrice.textContent = `$${total.toFixed(2)}`;
        } else {
          ticketCount.textContent = '0';
          totalPrice.textContent = 'R0.00';
        }
      }
      {%endblock%}
    </script>
  </body>
</html>
