{% extends 'base.html' %}
{% block title %}Update Movie{%endblock%}
{%block content%}
<!-- Main Content -->
<main class="container mx-auto px-6 py-8">
  <div class="max-w-2xl mx-auto">
    <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">
      Update Movie Details
    </h2>

    <!-- Movie Selection -->
    <form 
      action="{{ url_for('updateMovie') }}" 
      method="POST"
    >
      <div class="bg-white rounded-lg shadow-md p-6 mb-6 space-y-6">
        <h3 class="text-lg font-semibold text-gray-700 mb-4">
          Select Movie to Update
        </h3>
        <div>
          <label
            for="movie_select"
            class="block text-sm font-medium text-gray-700 mb-2"
            >Choose Movie:</label
          >
          <select
            name="movie_select"
            id="movie_select"
            required
            onchange="loadMovieDetails()"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
          >
            <option value="">Select a movie to update...</option>
            {% for movie in movies %}
              <option
                value="{{ movie.movie_id }}"
                data-title="{{ movie.title }}"
                data-price="{{ movie.ticket_price }}"
                data-tickets="{{ movie.ticket_available }}"
                data-release="{{ movie.release_date }}"
                data-end_date="{{ movie.end_date }}"
                data-room="{{ movie.cinema_room }}"
              >
                {{ movie.title }}
              </option>
              {% endfor %}
          </select>
        </div>
      </div>
    
    <!-- Update Movie Form -->
      <fieldset class="space-y-6">
        <legend
          class="text-xl font-semibold text-gray-700 mb-6 border-b border-gray-200 pb-2"
        >
          Movie Information
        </legend>

        <div>
          <label
            for="title"
            class="block text-sm font-medium text-gray-700 mb-2"
            >Movie Title:</label
          >
          <input
            type="text"
            name="title"
            id="title"
            required
            placeholder="Enter movie title"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
          />
        </div>

        <div>
          <label
            for="release_date"
            class="block text-sm font-medium text-gray-700 mb-2"
            >Release Date:</label
          >
          <input
            type="date"
            name="release_date"
            id="release_date"
            required
            placeholder="YYYY-MM-DD"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
          />
        </div>

        <div>
          <label
            for="end_date"
            class="block text-sm font-medium text-gray-700 mb-2"
            >End Date:</label
          >
          <input
            type="date"
            name="end_date"
            id="end_date"
            required
            placeholder="YYYY-MM-DD"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
          />
        </div>

        <div>
          <label
            for="cinema_room"
            class="block text-sm font-medium text-gray-700 mb-2"
            >Cinema Room:</label
          >
          <select
            name="cinema_room"
            id="cinema_room"
            required
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
          >
            <option value="">Select a cinema room...</option>
            <option value="1">Room 1</option>
            <option value="2">Room 2</option>
            <option value="3">Room 3</option>
            <option value="4">Room 4</option>
            <option value="5">Room 5</option>
            <option value="6">Room 6</option>
            <option value="7">Room 7</option>

          </select>
        </div>

        <div>
          <label
            for="tickets_available"
            class="block text-sm font-medium text-gray-700 mb-2"
            >Tickets Available:</label
          >
          <input
            type="number"
            name="tickets_available"
            id="tickets_available"
            min="1"
            max="500"
            value="0"
            required
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
          />
        </div>

        <div>
          <label
            for="ticket_price"
            class="block text-sm font-medium text-gray-700 mb-2"
            >Ticket Price (R):</label
          >
          <input
            type="number"
            name="ticket_price"
            id="ticket_price"
            min="0"
            step="10.00"
            value="0"
            required
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
          />
        </div>

        <div class="flex space-x-4 pt-4">
          <button
            type="submit"
            class="flex-1 bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-medium py-3 px-6 rounded-md hover:from-blue-700 hover:to-indigo-700 transition-all duration-200 shadow-md hover:shadow-lg"
          >
            Update Movie
          </button>
          <button
            type="reset"
            class="flex-1 bg-gray-500 text-white font-medium py-3 px-6 rounded-md hover:bg-gray-600 transition-all duration-200 shadow-md hover:shadow-lg"
          >
            Clear Form
          </button>
        </div>
      </fieldset>
    </form>
  </div>
</main>
{%endblock%}


    <!-- JavaScript for loading movie details -->
    <script>
      {%block script%}

      const movieData = {
        {% for movie in movies %}
        '{{ movie.movie_id }}': {
          ticket_price: '{{ movie.ticket_price }}',
          release_date: '{{ movie.release_date }}',
          cinema_room: '{{ movie.cinema_room }}',
          end_date: '{{ movie.end_date}}',
          tickets_available: '{{movie.tickets_available}}',
          title: '{{movie.title}}',
        },
        {% endfor %}
      };

      function loadMovieDetails() {
        const movieSelect = document.getElementById("movie_select");
        const selectedMovie = movieSelect.value;

        if (selectedMovie && movieData[selectedMovie]) {
          const movie = movieData[selectedMovie];

          // Populate form fields with selected movie data
          document.getElementById("title").value = movie.title;
          document.getElementById("release_date").value = movie.release_date;
          document.getElementById("end_date").value = movie.end_date;
          document.getElementById("cinema_room").value = movie.cinema_room;
          document.getElementById("tickets_available").value = movie.tickets_available;
          document.getElementById("ticket_price").value = movie.ticket_price;
        } else {
          // Clear form if no movie is selected
          document.getElementById("title").value = "";
          document.getElementById("release_date").value = "";
          document.getElementById("end_date").value = "";
          document.getElementById("cinema_room").value = "";
          document.getElementById("tickets_available").value = "50";
          document.getElementById("ticket_price").value = "12.99";
        }
      }
      {%endblock%}
    </script>
  </body>
</html>
