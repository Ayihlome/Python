<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Update A Movie</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="bg-gray-100 min-h-screen">
    <!-- Header -->
    <header
      class="bg-gradient-to-r from-blue-600 to-indigo-600 text-white shadow-lg"
    >
      <div class="container mx-auto px-6 py-4">
        <h1 class="text-3xl font-bold mb-2">Update A Movie</h1>
        <p class="text-blue-100 mb-6">Update a movie in the booking system</p>

        <!-- Navigation Menu -->
        <nav class="border-t border-purple-400 pt-4">
          <ul class="flex space-x-8">
            <li>
              <a
                href="{{ url_for('homePage') }}"
                class="hover:text-purple-200 font-medium transition-colors"
                >Home</a
              >
            </li>
            <li>
              <a
                href="{{ url_for('addMovie') }}"
                class="hover:text-purple-200 font-medium transition-colors"
                >Add Movie</a
              >
            </li>
            <li>
              <a
                href="{{ url_for('updateMovie') }}"
                class="hover:text-purple-200 font-medium transition-colors"
                >Update Movie</a
              >
            </li>
            <li>
              <a
                href="{{ url_for('deleteMovie') }}"
                class="hover:text-purple-200 font-medium transition-colors"
                >Delete Movie</a
              >
            </li>
          </ul>
        </nav>
      </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-6 py-8">
      <div class="max-w-2xl mx-auto">
        <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">
          Update Movie Details
        </h2>

        <!-- Movie Selection -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-6">
          <h3 class="text-lg font-semibold text-gray-700 mb-4">
            Select Movie to Update
          </h3>
          <div>
            <label
              for="movie_select"
              class="block text-sm font-medium text-gray-700 mb-2"
              >Choose Movie:</label
            >
            <select
              name="movie_select"
              id="movie_select"
              required
              onchange="loadMovieDetails()"
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            >
              <option value="">Select a movie to update...</option>
              <option value="movie1">Avengers: Endgame</option>
              <option value="movie2">Spider-Man: No Way Home</option>
              <option value="movie3">Black Panther: Wakanda Forever</option>
              <option value="movie4">The Batman</option>
              <option value="movie5">Top Gun: Maverick</option>
            </select>
          </div>
        </div>

        <!-- Update Movie Form -->
        <form
          action="#"
          method="post"
          class="bg-white rounded-lg shadow-md p-8"
        >
          <fieldset class="space-y-6">
            <legend
              class="text-xl font-semibold text-gray-700 mb-6 border-b border-gray-200 pb-2"
            >
              Movie Information
            </legend>

            <div>
              <label
                for="title"
                class="block text-sm font-medium text-gray-700 mb-2"
                >Movie Title:</label
              >
              <input
                type="text"
                name="title"
                id="title"
                required
                placeholder="Enter movie title"
                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
              />
            </div>

            <div>
              <label
                for="release_date"
                class="block text-sm font-medium text-gray-700 mb-2"
                >Release Date:</label
              >
              <input
                type="date"
                name="release_date"
                id="release_date"
                required
                placeholder="YYYY-MM-DD"
                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
              />
            </div>

            <div>
              <label
                for="end_date"
                class="block text-sm font-medium text-gray-700 mb-2"
                >End Date:</label
              >
              <input
                type="date"
                name="end_date"
                id="end_date"
                required
                placeholder="YYYY-MM-DD"
                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
              />
            </div>

            <div>
              <label
                for="cinema_room"
                class="block text-sm font-medium text-gray-700 mb-2"
                >Cinema Room:</label
              >
              <select
                name="cinema_room"
                id="cinema_room"
                required
                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
              >
                <option value="">Select a cinema room...</option>
                <option value="room1">Room 1</option>
                <option value="room2">Room 2</option>
                <option value="room3">Room 3</option>
                <option value="room4">Room 4</option>
                <option value="room5">Room 5</option>
              </select>
            </div>

            <div>
              <label
                for="tickets_available"
                class="block text-sm font-medium text-gray-700 mb-2"
                >Tickets Available:</label
              >
              <input
                type="number"
                name="tickets_available"
                id="tickets_available"
                min="1"
                max="200"
                value="50"
                required
                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
              />
            </div>

            <div>
              <label
                for="ticket_price"
                class="block text-sm font-medium text-gray-700 mb-2"
                >Ticket Price ($):</label
              >
              <input
                type="number"
                name="ticket_price"
                id="ticket_price"
                min="0"
                step="0.01"
                value="12.99"
                required
                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
              />
            </div>

            <div class="flex space-x-4 pt-4">
              <button
                type="submit"
                class="flex-1 bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-medium py-3 px-6 rounded-md hover:from-blue-700 hover:to-indigo-700 transition-all duration-200 shadow-md hover:shadow-lg"
              >
                Update Movie
              </button>
              <button
                type="reset"
                class="flex-1 bg-gray-500 text-white font-medium py-3 px-6 rounded-md hover:bg-gray-600 transition-all duration-200 shadow-md hover:shadow-lg"
              >
                Clear Form
              </button>
            </div>
          </fieldset>
        </form>
      </div>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-800 text-white py-6 mt-12">
      <div class="container mx-auto px-6 text-center">
        <p>&copy; 2024 Movie Ticket Booking System. All rights reserved.</p>
      </div>
    </footer>

    <!-- JavaScript for loading movie details -->
    <script>
      // Sample movie data - in a real application, this would come from a database
      const movieData = {
        movie1: {
          title: "Avengers: Endgame",
          release_date: "2019-04-26",
          end_date: "2019-07-26",
          cinema_room: "room1",
          tickets_available: 120,
          ticket_price: 15.99,
        },
        movie2: {
          title: "Spider-Man: No Way Home",
          release_date: "2021-12-17",
          end_date: "2022-03-17",
          cinema_room: "room2",
          tickets_available: 95,
          ticket_price: 14.99,
        },
        movie3: {
          title: "Black Panther: Wakanda Forever",
          release_date: "2022-11-11",
          end_date: "2023-02-11",
          cinema_room: "room3",
          tickets_available: 80,
          ticket_price: 13.99,
        },
        movie4: {
          title: "The Batman",
          release_date: "2022-03-04",
          end_date: "2022-06-04",
          cinema_room: "room4",
          tickets_available: 110,
          ticket_price: 12.99,
        },
        movie5: {
          title: "Top Gun: Maverick",
          release_date: "2022-05-27",
          end_date: "2022-08-27",
          cinema_room: "room5",
          tickets_available: 75,
          ticket_price: 16.99,
        },
      };

      function loadMovieDetails() {
        const movieSelect = document.getElementById("movie_select");
        const selectedMovie = movieSelect.value;

        if (selectedMovie && movieData[selectedMovie]) {
          const movie = movieData[selectedMovie];

          // Populate form fields with selected movie data
          document.getElementById("title").value = movie.title;
          document.getElementById("release_date").value = movie.release_date;
          document.getElementById("end_date").value = movie.end_date;
          document.getElementById("cinema_room").value = movie.cinema_room;
          document.getElementById("tickets_available").value =
            movie.tickets_available;
          document.getElementById("ticket_price").value = movie.ticket_price;
        } else {
          // Clear form if no movie is selected
          document.getElementById("title").value = "";
          document.getElementById("release_date").value = "";
          document.getElementById("end_date").value = "";
          document.getElementById("cinema_room").value = "";
          document.getElementById("tickets_available").value = "50";
          document.getElementById("ticket_price").value = "12.99";
        }
      }
    </script>
  </body>
</html>
